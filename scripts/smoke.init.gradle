allprojects {
    tasks.matching { it.name == 'verifyBuiltinModelIndex' }.configureEach {
        doFirst {
            def generated = layout.buildDirectory.dir('moddev/artifacts').get().asFile.toPath().toAbsolutePath().normalize()
            def classpath = toolClasspath.files.collect { file ->
                def path = file.toPath().toAbsolutePath().normalize()
                if (!path.startsWith(generated) || !file.name.startsWith('forge-') || !file.name.endsWith('.jar')) {
                    return file
                }
                def copy = layout.buildDirectory.file("ci/unsigned-${file.name}").get().asFile
                copy.parentFile.mkdirs()
                new java.util.zip.ZipFile(file).withCloseable { zip ->
                    new java.util.zip.ZipOutputStream(new FileOutputStream(copy)).withCloseable { out ->
                        zip.entries().each { entry ->
                            def name = entry.name.toUpperCase(Locale.ROOT)
                            if (!(name ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/) &&
                                !(name ==~ /META-INF\/SIG-[^\/]+/)) {
                                out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                                if (!entry.directory) {
                                    zip.getInputStream(entry).withCloseable { input -> input.transferTo(out) }
                                }
                                out.closeEntry()
                            }
                        }
                    }
                }
                println("Using unsigned copy of generated Forge development JAR: ${file}")
                copy
            }
            toolClasspath.setFrom(classpath)
        }
    }
    tasks.register('ciSmokeDependencies', Copy) {
        from configurations.compileClasspath.filter {
            (it.name.startsWith('jna-') && !it.name.startsWith('jna-platform-')) ||
                it.name.startsWith('log4j-api-') || it.name.startsWith('joml-') ||
                it.name.startsWith('fastutil-')
        }
        into System.getenv('CI_SMOKE_DIR')
    }
}

allprojects {
    afterEvaluate {
        if (tasks.findByName('verifyBuiltinModelIndex') == null) return
        def generated = layout.buildDirectory.dir('moddev/artifacts').get().asFile.toPath().toAbsolutePath().normalize()
        tasks.named('verifyBuiltinModelIndex').configure { task ->
            def original = task.toolClasspath.files.toList()
            def forge = original.findAll { file ->
                file.toPath().toAbsolutePath().normalize().startsWith(generated) &&
                    file.name.startsWith('forge-') && file.name.endsWith('.jar')
            }
            if (forge.size() != 1) {
                throw new GradleException("Expected one generated Forge development JAR, got: ${forge}")
            }
            def unsignedForge = tasks.register('ciUnsignedForge', Zip) {
                dependsOn tasks.named('createMinecraftArtifacts')
                from zipTree(forge[0])
                exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC', 'META-INF/SIG-*'
                destinationDirectory = layout.buildDirectory.dir('ci')
                archiveFileName = 'forge-unsigned.jar'
            }
            task.dependsOn(unsignedForge)
            task.toolClasspath.setFrom(original.collect {
                it == forge[0] ? unsignedForge.flatMap { archive -> archive.archiveFile } : it
            })
        }
    }
    tasks.register('ciSmokeDependencies', Copy) {
        from configurations.compileClasspath.filter {
            (it.name.startsWith('jna-') && !it.name.startsWith('jna-platform-')) ||
                it.name.startsWith('log4j-api-') || it.name.startsWith('joml-') ||
                it.name.startsWith('fastutil-')
        }
        into System.getenv('CI_SMOKE_DIR')
    }
}
